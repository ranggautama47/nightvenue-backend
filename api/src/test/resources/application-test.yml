spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/test}
    username: ${SPRING_DATASOURCE_USERNAME:test}
    password: ${SPRING_DATASOURCE_PASSWORD:test}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

nightvenue:
  payment:
    xendit:
      callback-token: test-callback-token
    reconciliation:
      enabled: false
      fixed-delay: PT1H
      min-age: PT1H
      batch-size: 50
      max-per-cycle: 50
  auth:
    jwt-secret: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    access-ttl: PT15M
    refresh-ttl: P7D
    cookie-secure: false
  ratelimit:
    login:
      capacity: 1000
    refresh:
      capacity: 1000
    logout:
      capacity: 1000
    me:
      capacity: 1000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
