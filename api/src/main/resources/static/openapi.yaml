openapi: 3.1.0
info:
  title: NightVenue Authentication API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Log in and create a refresh-token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              schema: { type: string, example: "nv_refresh=<opaque>; Path=/api/v1/auth; Max-Age=604800; HttpOnly; Secure; SameSite=Lax" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/refresh:
    post:
      summary: Rotate the refresh token and issue a new access token
      parameters:
        - in: cookie
          name: nv_refresh
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Token rotated
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Refresh rejected; refresh cookie is cleared
          headers:
            Set-Cookie:
              schema: { type: string, example: "nv_refresh=; Path=/api/v1/auth; Max-Age=0; HttpOnly; Secure; SameSite=Lax" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/logout:
    post:
      summary: Revoke this refresh-token family
      parameters:
        - in: cookie
          name: nv_refresh
          required: false
          schema: { type: string }
      responses:
        "204":
          description: Logged out; cookie cleared. Safe to call without a cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/me:
    get:
      summary: Read the authenticated user's current profile from the database
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /chat:
    post:
      summary: Ask a venue-scoped hybrid chat question
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "200":
          description: Chat answer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: Validation failed (invalid venueId or message)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /shifts:
    post:
      summary: Open the caller's own cashier shift for a venue
      description: |
        Roles: ADMIN, MANAGER, CASHIER. The cashier id is taken from the
        authenticated principal and cannot be supplied by the client.

        The new shift's business date is derived from the requested venue's
        timezone and business-day cutoff. If the caller already has an OPEN
        shift, it is returned as 409; if that OPEN shift is older than the
        current business date of its OWN venue, it is transitioned to
        MANAGER_REVIEW (with forced_review_at) and the audit action
        SHIFT_FORCED_REVIEW is written before the new shift is inserted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftOpenRequest" }
      responses:
        "201":
          description: Shift opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashierShift" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role not permitted (e.g. CUSTOMER)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Venue not found or venue access denied (concealment)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            SHIFT_ALREADY_OPEN: the caller already has an OPEN shift whose
            business date is not stale relative to its own venue.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /shifts/{id}/submit:
    post:
      summary: Submit counted cash and transition shift to SUBMITTED
      description: |
        Roles: ADMIN, MANAGER, CASHIER. Only the shift owner (cashier_id) can
        submit their own shift; non-owners receive 403 Forbidden.
        The shift must currently be in OPEN status. If the shift is stale
        relative to the venue's current business date, it is transitioned to
        MANAGER_REVIEW with forced_review_at, logged to audit, and rejected
        with 409 SHIFT_NOT_OPEN (returned in Problem.detail).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitShiftRequest" }
      responses:
        "200":
          description: Shift submitted successfully
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShiftSubmissionView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller is not the shift owner
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Shift is not OPEN, or was stale and flipped to MANAGER_REVIEW (Problem.detail = SHIFT_NOT_OPEN)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Total cash overflow on addition (Problem.detail = SHIFT_CASH_TOTAL_OVERFLOW)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /shifts/{id}/review:
    post:
      summary: Reconcile and close a cashier shift
      description: |
        Roles: ADMIN, MANAGER. Separation of duties is strictly enforced:
        shift owner cannot review their own shift (returns 403 Forbidden).
        Shift must be in SUBMITTED or MANAGER_REVIEW status.
        From SUBMITTED: actualCash must not be provided in the request body.
        From MANAGER_REVIEW: actualCash is required.
        Review note is mandatory if variance != 0 or if the shift was forced to review.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewShiftRequest" }
      responses:
        "200":
          description: Shift reconciled and closed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShiftReviewView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Caller is the shift owner or lacks ADMIN/MANAGER role
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Shift is not reviewable (Problem.detail = SHIFT_NOT_REVIEWABLE)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |
            Business rule violation (returned in Problem.detail):
            - ACTUAL_CASH_NOT_ALLOWED
            - ACTUAL_CASH_REQUIRED
            - REVIEW_NOTE_REQUIRED
            - SHIFT_CASH_TOTAL_OVERFLOW
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /orders/{orderId}/payments:
    post:
      summary: Record a payment against an order (CASH, CARD_EDC, or Xendit QRIS)
      description: |
        Roles: ADMIN, MANAGER, CASHIER; CUSTOMER is forbidden. Accepts CASH,
        CARD_EDC and QRIS. QRIS routes to the Xendit Payment Requests v3 API
        (QRIS_MIDTRANS is legacy, read-only, and rejected with 422
        PAYMENT_METHOD_NOT_SUPPORTED).

        QRIS flow: TX1 persists a PENDING/SENDING payment with a unique
        provider_reference_id, the provider is called OUTSIDE any database
        transaction or row lock, then TX2 finalizes. Outcomes: 201 confirmed
        QR (status PENDING, never PAID), 202 pending/ambiguous (no QR;
        includes provider timeouts, 5xx and unreadable responses), 422 provider
        validation rejection. A blank Xendit secret answers 503
        PROVIDER_NOT_CONFIGURED before anything is persisted. Automatic Create
        retries are never issued.

        Requires an active CASHIER/ADMIN/MANAGER OPEN shift for CASH (409
        SHIFT_NOT_OPEN when missing, stale for the order venue, or owned by
        someone else); CARD_EDC and QRIS need no shift. The payment business date is
        the business date at payment creation (order venue timezone/cutoff).
        amount must not exceed the outstanding balance (total_due minus the sum
        of PAID and PENDING payments, 422 otherwise). When the payment
        exhausts the remaining balance and base (subtotal minus
        discount_amount) is below minimum_spend_snapshot, 422
        MINIMUM_SPEND_NOT_MET is returned for CASH/CARD_EDC; a partial payment
        that does not exhaust the balance is allowed.

        Same key + same payload replays the stored snapshot without a second
        effect; same key + different payload returns 422. A key between TX1
        and TX2 (in flight) returns 409 PAYMENT_IN_PROGRESS with Retry-After.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCreateRequest" }
      responses:
        "201":
          description: |
            Payment recorded. CASH/CARD_EDC return PaymentCreated; a confirmed
            QRIS create returns QrisPaymentView with qrString (status PENDING,
            never PAID). Replay of the same key+payload returns the stored
            snapshot with the original status code and body.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/PaymentCreated"
                  - $ref: "#/components/schemas/QrisPaymentView"
        "202":
          description: |
            QRIS create outcome unknown or pending (provider timeout, 5xx,
            unreadable body, 2xx without a usable QR action). The payment is
            AMBIGUOUS and PENDING; qrString is null. The reservation is held;
            replay returns this snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrisPaymentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role not permitted (CUSTOMER)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Order not found or order access denied (cross-venue concealment)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            Order is not OPEN or PARTIALLY_PAID, or (CASH) SHIFT_NOT_OPEN:
            no or not the caller's OPEN shift, wrong venue, or business date
            not equal to the current business date of the order venue. The
            payment endpoint never mutates a shift. For QRIS additionally:
            PAYMENT_IN_PROGRESS (key in flight between TX1 and TX2, with
            Retry-After: 3) and PAYMENT_STATE_CONFLICT (the payment row was
            fenced: it moved off SENDING before finalization).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |
            PAYMENT_METHOD_NOT_SUPPORTED (QRIS_MIDTRANS), amount exceeds
            outstanding balance, MINIMUM_SPEND_NOT_MET, or Idempotency-Key
            reused with a different payload (BusinessRuleViolation). For QRIS
            a provider validation rejection (documented 400 error codes) also
            answers 422 with a QrisPaymentView body (REJECTED + FAILED,
            qrString null) and the X-Error-Code: PAYMENT_PROVIDER_REJECTED
            header; the reservation is released.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QrisPaymentView" }
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: |
            PROVIDER_NOT_CONFIGURED: the Xendit secret is blank. No idempotency
            row, no payment row and no provider request is created.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /payments/{paymentId}:
    get:
      summary: Fetch a recorded payment by id
      description: |
        Roles: ADMIN, MANAGER, CASHIER. Returns a safe public payment view:
        no provider identifiers (provider, provider_order_id,
        provider_transaction_id, provider_idempotency_key) and no provider
        charge orchestration metadata (charge_state, charge_started_at,
        charge_attempts). Unknown or cross-venue payments return 404
        (concealment). QR data fields for the Xendit slice will be added to
        this response later, after the provider contract is approved.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Payment found and the caller has venue access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role not permitted (CUSTOMER)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Payment not found or payment access denied (cross-venue concealment)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /orders/{orderId}/void:
    post:
      summary: Void an entire open order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 255 }
                disposition: { type: string, enum: [RESTORED, WASTED] }
      responses:
        "200":
          description: Voided order snapshot with effective item dispositions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoidedOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Manager approval required (ManagerApprovalRequired) or role not permitted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Order cannot be voided in its current state (Conflict)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Idempotency-Key reused with a different payload (BusinessRuleViolation)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /orders/{orderId}/items/{itemId}/serve:
    post:
      summary: Mark an ordered item served
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: itemId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated order with items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderWithItems" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role not permitted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Order or item cannot be served in its current state (Conflict)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /bottles:
    get:
      summary: List bottles stored at a venue
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: venueId
          required: true
          schema: { type: integer, format: int64 }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [ACTIVE, EMPTY, EXPIRED, RELEASED] }
        - in: query
          name: customerId
          required: false
          schema: { type: integer, format: int64 }
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: Bottles at the requested venue, ordered by stored time and vault ID descending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BottleQueryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Role not permitted }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Deposit a bottle from a paid order into the vault
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, orderItemId]
              properties:
                orderId: { type: integer, format: int64 }
                orderItemId: { type: integer, format: int64 }
      responses:
        "201":
          description: Bottle deposited into vault
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BottleVault" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role not permitted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Bottle vault already exists for this order item
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Business rule violation (order not paid, customer not verified, item not keepable, etc.)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /customers/me/bottles:
    get:
      summary: List the authenticated customer's bottles across venues
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [ACTIVE, EMPTY, EXPIRED, RELEASED] }
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: size
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: The authenticated customer's bottles, ordered by stored time and vault ID descending
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BottleQueryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Role not permitted }
        "404": { $ref: "#/components/responses/NotFound" }
  /bottles/redeem:
    post:
      summary: Redeem bottle volume into an order
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RedeemBottleRequest" }
      responses:
        "201":
          description: Bottle volume redeemed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BottleRedeemResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: Role not permitted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: Concurrent bottle state conflict }
        "422": { description: Business rule violation }
  /forecasts:
   post:
     summary: Generate an inventory forecast
     description: |
       Available to users with the ADMIN or MANAGER role. CASHIER requests return 403.
       `asOfBusinessDate` is the last completed business day in the input series.
       `predictedQuantity` is the cumulative total of non-negative daily forecasts
       over the requested horizon. A 422 response indicates insufficient or invalid
       history; its `detail` varies and the problem body has no `code` property.
       A 503 response means the forecast service is unavailable and contains a
       sanitized problem detail.
     security:
       - bearerAuth: []
     requestBody:
       required: true
       content:
         application/json:
           schema: { $ref: "#/components/schemas/ForecastRequest" }
     responses:
       "200":
         description: Forecast generated and persisted
         content:
           application/json:
             schema: { $ref: "#/components/schemas/ForecastResponse" }
       "400":
         description: Invalid request body, missing required field, or horizonDays outside 1..14
         content:
           application/problem+json:
             schema: { $ref: "#/components/schemas/Problem" }
       "401": { $ref: "#/components/responses/Unauthorized" }
       "403":
         description: Caller does not have the ADMIN or MANAGER role
         content:
           application/problem+json:
             schema: { $ref: "#/components/schemas/Problem" }
       "404": { $ref: "#/components/responses/NotFound" }
       "422":
         description: Insufficient local history or invalid history reported by the forecast service; detail text varies and no code property is returned
         content:
           application/problem+json:
             schema: { $ref: "#/components/schemas/Problem" }
       "503":
         description: Forecast service unavailable; upstream failure details are sanitized
         content:
           application/problem+json:
             schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, fullName, role, venueIds]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        fullName: { type: string }
        role: { type: string, enum: [ADMIN, MANAGER, CASHIER, CUSTOMER] }
        venueIds:
          type: array
          items: { type: integer, format: int64 }
    AuthResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconds until access-token expiry }
        user: { $ref: "#/components/schemas/User" }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail:
          type: string
          description: Human-readable explanation or machine-readable business rule code (e.g. SHIFT_NOT_OPEN, SHIFT_NOT_REVIEWABLE, ACTUAL_CASH_NOT_ALLOWED, ACTUAL_CASH_REQUIRED, REVIEW_NOTE_REQUIRED, SHIFT_CASH_TOTAL_OVERFLOW).
        traceId: { type: string }
    OrderItem:
      type: object
