          type: integer
          format: int64
          minimum: 0
          description: Counted physical cash at shift close
        note:
          type: [string, "null"]
          maxLength: 255
          description: Cashier closing note (trimmed; blank becomes null)
    ShiftSubmissionView:
      type: object
      required:
        - id
        - status
        - openingFloat
        - expectedCash
        - actualCash
        - variance
        - submittedAt
        - submitNote
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [SUBMITTED] }
        openingFloat: { type: integer, format: int64, minimum: 0 }
        expectedCash: { type: integer, format: int64, minimum: 0 }
        actualCash: { type: integer, format: int64, minimum: 0 }
        variance: { type: integer, format: int64, description: "actualCash minus expectedCash (can be negative)" }
        submittedAt: { type: string, format: date-time }
        submitNote: { type: [string, "null"], maxLength: 255 }
    ReviewShiftRequest:
      type: object
      properties:
        actualCash:
          type: [integer, "null"]
          format: int64
          minimum: 0
          description: Forbidden for SUBMITTED shifts; required for MANAGER_REVIEW shifts
        note:
          type: [string, "null"]
          maxLength: 255
          description: Required when variance != 0 or forcedReviewAt != null
    ShiftReviewView:
      type: object
      required:
        - id
        - venueId
        - cashierId
        - businessDate
        - status
        - openingFloat
        - expectedCash
        - actualCash
        - variance
