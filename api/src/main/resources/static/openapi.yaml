        expiryDate: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, EMPTY, EXPIRED, RELEASED] }
    ForecastRequest:
     type: object
     required: [venueId, ingredientId]
     properties:
       venueId: { type: integer, format: int64 }
       ingredientId: { type: integer, format: int64 }
       horizonDays:
         type: [integer, "null"]
         format: int32
         default: 7
         minimum: 1
         maximum: 14
    ForecastResponse:
     type: object
     required: [forecastId, venueId, ingredientId, unit, horizonDays, predictedQuantity, selectedModel, modelName, modelMae, baselineMae, inputDays, asOfBusinessDate, generatedAt]
     properties:
       forecastId: { type: integer, format: int64 }
       venueId: { type: integer, format: int64 }
       ingredientId: { type: integer, format: int64 }
       unit: { type: string, enum: [ML, GRAM, PIECE] }
       horizonDays: { type: integer, format: int32 }
       predictedQuantity:
         type: number
         minimum: 0
         description: Cumulative total of non-negative daily forecasts over the horizon; JSON number scale is not guaranteed.
       selectedModel:
         type: string
         enum: [REGRESSION, BASELINE]
         description: Method selected by backtest MAE; ties select REGRESSION.
       modelName:
         type: string
         enum: [ols_weekday_trend, baseline_dow_mean]
         description: Name of the selected method.
       modelMae:
         type: number
         description: Regression mean absolute error over the last horizonDays observations in the input series.
       baselineMae:
         type: number
         description: Same-weekday baseline mean absolute error over the last horizonDays observations in the input series.
       inputDays: { type: integer, format: int32, minimum: 28 }
       asOfBusinessDate:
         type: string
         format: date
         description: Last completed business day in the input series.
       generatedAt: { type: string, format: date-time }
    ChatRequest:
      type: object
      required: [venueId, message]
      properties:
        venueId: { type: integer, format: int64, minimum: 1 }
        message:
          type: string
          description: 1 to 500 Unicode code points after trimming
    ChatResponse:
      type: object
      required: [answer, route]
      properties:
        answer: { type: string }
        route:
          type: string
          enum: [LOCAL, FALLBACK, REFUSED, ADVANCED_AI_REQUIRED]
          description: Routing outcome; LLM is reserved for a later phase and is never returned now.
        intent: { type: [string, "null"] }
        confidence: { type: [number, "null"] }
        modelVersion: { type: [string, "null"] }
  responses:
    BadRequest:
      description: Invalid JSON, missing field, or password over 72 UTF-8 bytes
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Invalid credentials or bearer token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: Redis is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
