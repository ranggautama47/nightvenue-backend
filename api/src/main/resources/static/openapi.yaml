openapi: 3.1.0
info:
  title: NightVenue Authentication API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Log in and create a refresh-token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              schema: { type: string, example: "nv_refresh=<opaque>; Path=/api/v1/auth; Max-Age=604800; HttpOnly; Secure; SameSite=Lax" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/refresh:
    post:
      summary: Rotate the refresh token and issue a new access token
      parameters:
        - in: cookie
          name: nv_refresh
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Token rotated
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Refresh rejected; refresh cookie is cleared
          headers:
            Set-Cookie:
              schema: { type: string, example: "nv_refresh=; Path=/api/v1/auth; Max-Age=0; HttpOnly; Secure; SameSite=Lax" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/logout:
    post:
      summary: Revoke this refresh-token family
      parameters:
        - in: cookie
          name: nv_refresh
          required: false
          schema: { type: string }
      responses:
        "204":
          description: Logged out; cookie cleared. Safe to call without a cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/me:
    get:
      summary: Read the authenticated user's current profile from the database
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, fullName, role, venueIds]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        fullName: { type: string }
        role: { type: string, enum: [ADMIN, MANAGER, CASHIER, CUSTOMER] }
        venueIds:
          type: array
          items: { type: integer, format: int64 }
    AuthResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconds until access-token expiry }
        user: { $ref: "#/components/schemas/User" }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
  responses:
    BadRequest:
      description: Invalid JSON, missing field, or password over 72 UTF-8 bytes
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Invalid credentials or bearer token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: Redis is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
