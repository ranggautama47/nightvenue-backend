openapi: 3.1.0
info:
  title: NightVenue Authentication API
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      summary: Log in and create a refresh-token family
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Authenticated
          headers:
            Set-Cookie:
              schema: { type: string, example: "nv_refresh=<opaque>; Path=/api/v1/auth; Max-Age=604800; HttpOnly; Secure; SameSite=Lax" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/refresh:
    post:
      summary: Rotate the refresh token and issue a new access token
      parameters:
        - in: cookie
          name: nv_refresh
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Token rotated
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "401":
          description: Refresh rejected; refresh cookie is cleared
          headers:
            Set-Cookie:
              schema: { type: string, example: "nv_refresh=; Path=/api/v1/auth; Max-Age=0; HttpOnly; Secure; SameSite=Lax" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/logout:
    post:
      summary: Revoke this refresh-token family
      parameters:
        - in: cookie
          name: nv_refresh
          required: false
          schema: { type: string }
      responses:
        "204":
          description: Logged out; cookie cleared. Safe to call without a cookie.
          headers:
            Set-Cookie:
              schema: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /auth/me:
    get:
      summary: Read the authenticated user's current profile from the database
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /shifts:
    post:
      summary: Open the caller's own cashier shift for a venue
      description: |
        Roles: ADMIN, MANAGER, CASHIER. The cashier id is taken from the
        authenticated principal and cannot be supplied by the client.

        The new shift's business date is derived from the requested venue's
        timezone and business-day cutoff. If the caller already has an OPEN
        shift, it is returned as 409; if that OPEN shift is older than the
        current business date of its OWN venue, it is transitioned to
        MANAGER_REVIEW (with forced_review_at) and the audit action
        SHIFT_FORCED_REVIEW is written before the new shift is inserted.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShiftOpenRequest" }
      responses:
        "201":
          description: Shift opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashierShift" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role not permitted (e.g. CUSTOMER)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Venue not found or venue access denied (concealment)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            SHIFT_ALREADY_OPEN: the caller already has an OPEN shift whose
            business date is not stale relative to its own venue.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /orders/{orderId}/payments:
    post:
      summary: Record a CASH or CARD_EDC payment against an order
      description: |
        Roles: ADMIN, MANAGER, CASHIER; CUSTOMER is forbidden. M2 accepts only
        CASH and CARD_EDC; QRIS_MIDTRANS is rejected with 422
        PAYMENT_METHOD_NOT_SUPPORTED.

        Requires an active CASHIER/ADMIN/MANAGER OPEN shift for CASH (409
        SHIFT_NOT_OPEN when missing, stale for the order venue, or owned by
        someone else); CARD_EDC needs no shift. The payment business date is
        the business date at payment creation (order venue timezone/cutoff).
        amount must not exceed the outstanding balance (total_due minus the sum
        of PAID and PENDING payments, 422 otherwise). When the payment
        exhausts the remaining balance and base (subtotal minus
        discount_amount) is below minimum_spend_snapshot, 422
        MINIMUM_SPEND_NOT_MET is returned; a partial payment that does not
        exhaust the balance is allowed.

        Same key + same hash replays the stored 201 snapshot without creating
        a payment; same key + different payload returns 422. A failed request
        rolls the reservation back so the key can be reused.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentCreateRequest" }
      responses:
        "201":
          description: Payment recorded; replay of the same key+hash returns this snapshot again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentCreated" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role not permitted (CUSTOMER)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Order not found or order access denied (cross-venue concealment)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: |
            Order is not OPEN or PARTIALLY_PAID, or (CASH) SHIFT_NOT_OPEN:
            no or not the caller's OPEN shift, wrong venue, or business date
            not equal to the current business date of the order venue. The
            payment endpoint never mutates a shift.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: |
            PAYMENT_METHOD_NOT_SUPPORTED (QRIS_MIDTRANS), amount exceeds
            outstanding balance, MINIMUM_SPEND_NOT_MET, or Idempotency-Key
            reused with a different payload (BusinessRuleViolation).
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /payments/{paymentId}:
    get:
      summary: Fetch a recorded payment by id
      description: |
        Roles: ADMIN, MANAGER, CASHIER. Returns a safe public payment view:
        no provider identifiers (provider, provider_order_id,
        provider_transaction_id, provider_idempotency_key) and no provider
        charge orchestration metadata (charge_state, charge_started_at,
        charge_attempts). Unknown or cross-venue payments return 404
        (concealment). QR data fields for the Xendit slice will be added to
        this response later, after the provider contract is approved.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Payment found and the caller has venue access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role not permitted (CUSTOMER)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404":
          description: Payment not found or payment access denied (cross-venue concealment)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /orders/{orderId}/void:
    post:
      summary: Void an entire open order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 255 }
                disposition: { type: string, enum: [RESTORED, WASTED] }
      responses:
        "200":
          description: Voided order snapshot with effective item dispositions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoidedOrder" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Manager approval required (ManagerApprovalRequired) or role not permitted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Order cannot be voided in its current state (Conflict)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Idempotency-Key reused with a different payload (BusinessRuleViolation)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /orders/{orderId}/items/{itemId}/serve:
    post:
      summary: Mark an ordered item served
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: integer, format: int64 }
        - in: path
          name: itemId
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Updated order with items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderWithItems" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Role not permitted
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Order or item cannot be served in its current state (Conflict)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required: [id, email, fullName, role, venueIds]
      properties:
        id: { type: integer, format: int64 }
        email: { type: string }
        fullName: { type: string }
        role: { type: string, enum: [ADMIN, MANAGER, CASHIER, CUSTOMER] }
        venueIds:
          type: array
          items: { type: integer, format: int64 }
    AuthResponse:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconds until access-token expiry }
        user: { $ref: "#/components/schemas/User" }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        traceId: { type: string }
    OrderItem:
      type: object
      required: [id, orderId, productId, itemType, productNameSnapshot, unitPriceSnapshot, quantity, lineTotal, status, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        itemType: { type: string, enum: [PRODUCT, BOTTLE_REDEMPTION] }
        productNameSnapshot: { type: string }
        unitPriceSnapshot: { type: integer, format: int64 }
        quantity: { type: integer }
        lineTotal: { type: integer, format: int64 }
        status: { type: string, enum: [ORDERED, SERVED, VOIDED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OrderWithItems:
      type: object
      required: [id, venueId, orderNumber, cashierId, businessDate, status, subtotal, discountAmount, serviceChargeAmount, taxAmount, totalDue, paidTotal, minimumSpendSnapshot, openedAt, version, items]
      properties:
        id: { type: integer, format: int64 }
        venueId: { type: integer, format: int64 }
        orderNumber: { type: string }
        tableId: { type: [integer, "null"], format: int64 }
        customerId: { type: [integer, "null"], format: int64 }
        cashierId: { type: integer, format: int64 }
        businessDate: { type: string, format: date }
        status: { type: string, enum: [OPEN, PARTIALLY_PAID, PAID, VOIDED, REFUNDED] }
        subtotal: { type: integer, format: int64 }
        discountAmount: { type: integer, format: int64 }
        serviceChargeAmount: { type: integer, format: int64 }
        taxAmount: { type: integer, format: int64 }
        totalDue: { type: integer, format: int64 }
        paidTotal: { type: integer, format: int64 }
        minimumSpendSnapshot: { type: integer, format: int64 }
        openedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
    ShiftOpenRequest:
      type: object
      required: [venueId, openingFloat]
      properties:
        venueId: { type: integer, format: int64, minimum: 1 }
        openingFloat: { type: integer, format: int64, minimum: 0 }
    CashierShift:
      type: object
      required: [id, venueId, cashierId, businessDate, status, openingFloat, openedAt, version, createdAt, updatedAt]
      properties:
        id: { type: integer, format: int64 }
        venueId: { type: integer, format: int64 }
        cashierId: { type: integer, format: int64 }
        businessDate: { type: string, format: date }
        status: { type: string, enum: [OPEN, SUBMITTED, MANAGER_REVIEW, RECONCILED] }
        openingFloat: { type: integer, format: int64, minimum: 0 }
        openedAt: { type: string, format: date-time }
        forcedReviewAt: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PaymentCreateRequest:
      type: object
      required: [method, amount]
      properties:
        method: { type: string, enum: [CASH, CARD_EDC, QRIS_MIDTRANS], description: QRIS_MIDTRANS is rejected with 422 on this endpoint }
        amount: { type: integer, format: int64, minimum: 1 }
        referenceNote: { type: [string, "null"], maxLength: 100, description: Trimmed before hashing and storage; null/empty/whitespace-only is stored as null; a literal "-" stays "-" }
    Payment:
      type: object
      required: [id, orderId, venueId, businessDate, shiftId, method, amount, status, chargeAttempts, referenceNote, paidAt, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        venueId: { type: integer, format: int64 }
        businessDate: { type: string, format: date }
        shiftId: { type: [integer, "null"], format: int64, description: Set for CASH, null for CARD_EDC }
        method: { type: string, enum: [CASH, CARD_EDC, QRIS_MIDTRANS] }
        amount: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [PENDING, PAID, FAILED, EXPIRED, CANCELLED, REFUNDED] }
        provider: { type: [string, "null"], description: Always null on this endpoint (provider fields are reserved for M3/Midtrans) }
        providerOrderId: { type: [string, "null"] }
        providerTransactionId: { type: [string, "null"] }
        providerIdempotencyKey: { type: [string, "null"], format: uuid }
        chargeState: { type: [string, "null"] }
        chargeAttempts: { type: integer, description: 0 on this endpoint }
        expiresAt: { type: [string, "null"], format: date-time }
        referenceNote: { type: [string, "null"], maxLength: 100 }
        paidAt: { type: string, format: date-time }
        createdBy: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    PaymentView:
      type: object
      required: [id, orderId, venueId, businessDate, shiftId, method, amount, status, expiresAt, referenceNote, paidAt, createdBy, createdAt, updatedAt, version]
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        venueId: { type: integer, format: int64 }
        businessDate: { type: string, format: date }
        shiftId: { type: [integer, "null"], format: int64, description: Set for CASH, null for CARD_EDC }
        method: { type: string, enum: [CASH, CARD_EDC, QRIS_MIDTRANS] }
        amount: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [PENDING, PAID, FAILED, EXPIRED, CANCELLED, REFUNDED] }
        expiresAt: { type: [string, "null"], format: date-time }
        referenceNote: { type: [string, "null"], maxLength: 100 }
        paidAt: { type: [string, "null"], format: date-time }
        createdBy: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    OrderSnapshot:
      type: object
      required: [id, venueId, orderNumber, cashierId, businessDate, status, subtotal, discountAmount, serviceChargeAmount, taxAmount, totalDue, paidTotal, minimumSpendSnapshot, openedAt, version]
      properties:
        id: { type: integer, format: int64 }
        venueId: { type: integer, format: int64 }
        orderNumber: { type: string }
        tableId: { type: [integer, "null"], format: int64 }
        customerId: { type: [integer, "null"], format: int64 }
        cashierId: { type: integer, format: int64 }
        businessDate: { type: string, format: date }
        status: { type: string, enum: [OPEN, PARTIALLY_PAID, PAID, VOIDED, REFUNDED] }
        subtotal: { type: integer, format: int64 }
        discountAmount: { type: integer, format: int64 }
        serviceChargeAmount: { type: integer, format: int64 }
        taxAmount: { type: integer, format: int64 }
        totalDue: { type: integer, format: int64 }
        paidTotal: { type: integer, format: int64 }
        minimumSpendSnapshot: { type: integer, format: int64 }
        openedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64 }
    PaymentCreated:
      type: object
      required: [payment, order]
      properties:
        payment: { $ref: "#/components/schemas/Payment" }
        order: { $ref: "#/components/schemas/OrderSnapshot" }
    VoidedItem:
      type: object
      required: [id, orderId, productId, itemType, productNameSnapshot, unitPriceSnapshot, quantity, lineTotal, status, createdAt, updatedAt, disposition]
      properties:
        id: { type: integer, format: int64 }
        orderId: { type: integer, format: int64 }
        productId: { type: integer, format: int64 }
        itemType: { type: string, enum: [PRODUCT, BOTTLE_REDEMPTION] }
        productNameSnapshot: { type: string }
        unitPriceSnapshot: { type: integer, format: int64 }
        quantity: { type: integer }
        lineTotal: { type: integer, format: int64 }
        status: { type: string, enum: [ORDERED, SERVED, VOIDED] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        disposition: { type: string, enum: [RESTORED, WASTED] }
    VoidedOrder:
      type: object
      required: [id, venueId, orderNumber, cashierId, businessDate, status, subtotal, discountAmount, serviceChargeAmount, taxAmount, totalDue, paidTotal, minimumSpendSnapshot, openedAt, version, items]
      properties:
        id: { type: integer, format: int64 }
        venueId: { type: integer, format: int64 }
        orderNumber: { type: string }
        tableId: { type: [integer, "null"], format: int64 }
        customerId: { type: [integer, "null"], format: int64 }
        cashierId: { type: integer, format: int64 }
        businessDate: { type: string, format: date }
        status: { type: string, enum: [OPEN, PARTIALLY_PAID, PAID, VOIDED, REFUNDED] }
        subtotal: { type: integer, format: int64 }
        discountAmount: { type: integer, format: int64 }
        serviceChargeAmount: { type: integer, format: int64 }
        taxAmount: { type: integer, format: int64 }
        totalDue: { type: integer, format: int64 }
        paidTotal: { type: integer, format: int64 }
        minimumSpendSnapshot: { type: integer, format: int64 }
        openedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/VoidedItem" }
  responses:
    BadRequest:
      description: Invalid JSON, missing field, or password over 72 UTF-8 bytes
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Invalid credentials or bearer token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unavailable:
      description: Redis is unavailable
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
