spring:
  application:
    name: nightvenue-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 10000
      maximum-pool-size: 10

  flyway:
    enabled: true

  data:
    redis:
      url: ${REDIS_URL}

nightvenue:
  seed:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,redis

server:
  port: 8080
  shutdown: graceful
