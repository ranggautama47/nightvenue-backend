name: Secret Scanning (Gitleaks)

# Gitleaks is MIT licensed. The gitleaks-action used here is the official
# action published by the gitleaks maintainers and is free for open-source
# repositories. No GITLEAKS_LICENSE key required for public repos.
# Action pinned to version tag: gitleaks/gitleaks-action@v2.3.7
# Source: https://github.com/gitleaks/gitleaks-action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
