services:

  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_DB: nightvenue
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
    ports:
      # Bound to 127.0.0.1 only — DEV CONVENIENCE; not published in production
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME} -d nightvenue"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4.2-alpine
    ports:
      # Bound to 127.0.0.1 only — DEV CONVENIENCE; not published in production
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-service:8000}
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:?ML_INTERNAL_TOKEN is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-PT15M}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-P7D}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # By default, only loopback proxies are trusted. To trust Docker bridge gateway or external reverse proxy,
      # override APP_TRUSTED_PROXIES explicitly (e.g. in .env or deployment configuration).
      APP_TRUSTED_PROXIES: ${APP_TRUSTED_PROXIES:-127[.][0-9]+[.][0-9]+[.][0-9]+|::1|0:0:0:0:0:0:0:1}
      AUTH_RATE_LIMIT_LOGIN: ${AUTH_RATE_LIMIT_LOGIN:-5}
      AUTH_RATE_LIMIT_REFRESH: ${AUTH_RATE_LIMIT_REFRESH:-10}
      AUTH_RATE_LIMIT_REFRESH_PERIOD: ${AUTH_RATE_LIMIT_REFRESH_PERIOD:-PT1M}
      AUTH_RATE_LIMIT_LOGOUT: ${AUTH_RATE_LIMIT_LOGOUT:-20}
      AUTH_RATE_LIMIT_LOGOUT_PERIOD: ${AUTH_RATE_LIMIT_LOGOUT_PERIOD:-PT1M}
      AUTH_RATE_LIMIT_ME: ${AUTH_RATE_LIMIT_ME:-30}
      AUTH_RATE_LIMIT_ME_PERIOD: ${AUTH_RATE_LIMIT_ME_PERIOD:-PT1M}
      NIGHTVENUE_OPENAPI_PUBLIC: ${NIGHTVENUE_OPENAPI_PUBLIC:-false}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-}
      NIGHTVENUE_SEED_ENABLED: ${NIGHTVENUE_SEED_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    # No 'ports' here — ml-service is internal only (APPLICATION_ARCHITECTURE.md section 6)
    expose:
      - "8000"
    environment:
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:?ML_INTERNAL_TOKEN is required}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; r = urllib.request.urlopen('http://localhost:8000/health', timeout=4); sys.exit(0 if r.status == 200 else 1)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
